name: CI/CD — casino-frontend

on:
  push:
    branches:
      - deploy
    tags:
      - "v*.*.*"

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  EKS_CLUSTER: ${{ secrets.EKS_CLUSTER }}

jobs:
  # ── BUILD ──────────────────────────────────────────────────────────────────
  build:
    name: Build — preparar entorno
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 3. Instalar dependencias
        run: npm ci

  # ── TEST ───────────────────────────────────────────────────────────────────
  test:
    name: Test — Karma + ChromeHeadless
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Ejecutar pruebas unitarias
        run: npm test -- --watch=false --browsers=ChromeHeadless

  # ── PUSH ───────────────────────────────────────────────────────────────────
  push:
    name: Push — Amazon ECR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 3. Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Calcular tag de imagen
        id: meta
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 5. Build imagen Frontend
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          SHA="${{ github.sha }}"
          IMAGE="${REGISTRY}/${REPO}:${SHA}"

          docker build \
            --tag "${IMAGE}" \
            --label "git-commit=${SHA}" \
            --label "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: 6. Push imagen Frontend a ECR
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          SHA="${{ github.sha }}"
          IMAGE="${REGISTRY}/${REPO}:${SHA}"

          docker tag "${IMAGE}" "${REGISTRY}/${REPO}:latest"
          docker push "${IMAGE}"
          docker push "${REGISTRY}/${REPO}:latest"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            docker tag "${IMAGE}" "${REGISTRY}/${REPO}:${VERSION}"
            docker push "${REGISTRY}/${REPO}:${VERSION}"
          fi

      - name: 7. Verificar que el tag exista en ECR
        run: |
          aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}" \
            --image-ids imageTag="${{ github.sha }}"

  # ── DEPLOY ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy — EKS
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 3. Actualizar kubeconfig y desplegar en EKS
        env:
          IMAGE_TAG: ${{ needs.push.outputs.image_tag }}
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.EKS_CLUSTER }}" \
            --region "${{ env.AWS_REGION }}"

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          FULL_IMAGE="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"

          echo "Imagen a desplegar: ${FULL_IMAGE}"

          aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}" \
            --image-ids imageTag="${IMAGE_TAG}"

          sed -i \
            "s|<AWS_ACCOUNT_ID>|${ACCOUNT_ID}|g; \
             s|<REGION>|${{ env.AWS_REGION }}|g; \
             s|image: .*|image: ${FULL_IMAGE}|g" \
            k8s/frontend-deployment.yaml

          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/frontend-hpa.yaml

          kubectl rollout status deployment/casino-frontend --timeout=300s

      - name: 4. Verificar pods y URL pública
        run: |
          echo "── Pods ──────────────────────────────────"
          kubectl get pods -l app=casino-frontend
          echo "── HPA ───────────────────────────────────"
          kubectl get hpa casino-frontend-hpa
          echo "── URL pública (LoadBalancer) ────────────"
          kubectl get service frontend-service \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo ""