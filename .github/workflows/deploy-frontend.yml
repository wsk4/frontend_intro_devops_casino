name: CI/CD — casino-frontend

# Disparado por push a la rama deploy o por Git tag vX.Y.Z
on:
  push:
    branches:
      - deploy
    tags:
      - "v*.*.*"

env:
  AWS_REGION:     ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  EKS_CLUSTER:    ${{ secrets.EKS_CLUSTER }}

jobs:

  # ── TEST ───────────────────────────────────────────────────────────────────
  # Si los tests fallan, build/push/deploy quedan skipped automáticamente.
  test:
    name: Test — Karma + ChromeHeadless
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Ejecutar pruebas unitarias
        run: npx ng test --watch=false --browsers=ChromeHeadless

  # ── BUILD ──────────────────────────────────────────────────────────────────
  build:
    name:  Build — imagen Docker
    runs-on: ubuntu-latest
    needs: test

    outputs:
      tags:  ${{ steps.tags.outputs.tags }}
      image: ${{ steps.tags.outputs.image }}

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: 3. Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tres tags simultáneos: vX.Y.Z (si es tag), latest y SHA del commit
      - name: 4. Calcular tags de imagen
        id: tags
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          SHA="${{ github.sha }}"
          BASE="${REGISTRY}/${REPO}"

          TAGS="${BASE}:${SHA}"
          TAGS="${TAGS},${BASE}:latest"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${BASE}:${VERSION}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "image=${BASE}:${SHA}" >> $GITHUB_OUTPUT
          echo "Tags a publicar: ${TAGS}"

      - name: 5. Build de la imagen Docker
        run: |
          docker build \
            --tag ${{ steps.tags.outputs.image }} \
            --label "git-commit=${{ github.sha }}" \
            --label "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: 6. Exportar imagen como artefacto
        run: docker save ${{ steps.tags.outputs.image }} | gzip > frontend-image.tar.gz

      - name: 7. Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar.gz
          retention-days: 1

  # ── PUSH ───────────────────────────────────────────────────────────────────
  push:
    name:  Push — Amazon ECR
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 1. Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: 2. Login a Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: 3. Descargar artefacto de imagen
        uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: 4. Cargar imagen en Docker
        run: docker load < frontend-image.tar.gz

      # Lógica de push idéntica al original (itera sobre todos los tags)
      - name: 5. Push a Amazon ECR (todos los tags)
        run: |
          IFS=',' read -ra TAG_LIST <<< "${{ needs.build.outputs.tags }}"
          for TAG in "${TAG_LIST[@]}"; do
            docker tag ${{ needs.build.outputs.image }} "${TAG}"
            docker push "${TAG}"
          done

  # ── DEPLOY ─────────────────────────────────────────────────────────────────
  deploy:
    name:  Deploy — EKS
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # Lógica de deploy idéntica al original
      - name: 3. Actualizar kubeconfig y desplegar en EKS
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          sed -i \
            "s|<AWS_ACCOUNT_ID>|${ACCOUNT_ID}|g; \
             s|<REGION>|${{ env.AWS_REGION }}|g; \
             s|:latest|:${IMAGE_TAG}|g" \
            k8s/frontend-deployment.yaml

          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/frontend-hpa.yaml

          kubectl rollout status deployment/casino-frontend --timeout=120s

      - name: 4. Verificar pods y URL pública
        run: |
          echo "── Pods ──────────────────────────────────"
          kubectl get pods -l app=casino-frontend
          echo "── HPA ───────────────────────────────────"
          kubectl get hpa casino-frontend-hpa
          echo "── URL pública (LoadBalancer) ────────────"
          kubectl get service frontend-service \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo ""